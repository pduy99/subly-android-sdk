[versions]
minSdk = "31"
targetSdk = "36"
compileSdk = "36"
compileSdkMinor = "1"
agp = "9.2.0-rc01"
kotlin = "2.3.21"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
testRunner = "1.7.0"
testServices = "1.6.0"
coroutines = "1.11.0"
mockito = "5.14.2"
mockitoKotlin = "5.4.0"
mlkitTextRecognition = "16.0.1"
mlkitTranslate = "17.0.3"
mlkitLanguageId = "17.0.6"
okhttp = "4.12.0"
gson = "2.11.0"
anthropic = "2.34.0"
vosk = "0.3.75"
# Pinned deliberately: "latest.release" makes the build non-reproducible, and
# this API is still pre-1.0 and moves between minors.
#
# 0.16.1 rather than the newest (0.17.0): 0.17.0 is built against Kotlin 2.4,
# whose class metadata the Kotlin compiler AGP 9.2 embeds (2.2.x) cannot read —
# it fails compilation outright, not just with a warning. 0.16.1 is the last
# release on Kotlin 2.2.x. Its API surface is identical to 0.17.0 for
# everything this module uses (Engine/EngineConfig, ConversationConfig with
# maxOutputToken, SamplerConfig, Contents/Content.Text), so nothing here is
# waiting on the bump. Revisit when the project moves to Kotlin 2.4.
litertlm = "0.16.1"
coreKtx = "1.10.1"
annotation = "1.9.1"
appcompat = "1.6.1"
material = "1.10.0"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
androidx-test-services = { group = "androidx.test.services", name = "test-services", version.ref = "testServices" }
androidx-test-storage = { group = "androidx.test.services", name = "storage", version.ref = "testServices" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-android = { group = "org.mockito", name = "mockito-android", version.ref = "mockito" }
mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockitoKotlin" }
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextRecognition" }
mlkit-translate = { group = "com.google.mlkit", name = "translate", version.ref = "mlkitTranslate" }
mlkit-language-id = { group = "com.google.mlkit", name = "language-id", version.ref = "mlkitLanguageId" }
litert-lm = { group = "com.google.ai.edge.litertlm", name = "litertlm-android", version.ref = "litertlm" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
anthropic-java = { group = "com.anthropic", name = "anthropic-java", version.ref = "anthropic" }
vosk-android = { group = "com.alphacephei", name = "vosk-android", version.ref = "vosk" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
